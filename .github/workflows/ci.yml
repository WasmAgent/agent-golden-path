name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies (root)
        run: bun install --frozen-lockfile

      # GP-2: the required lane asserts the certified stack. Drift fails here,
      # so this can never silently test a different stack than certified.
      - name: Certified stack check (GP-2)
        run: node scripts/check-certified-stack.mjs

      - name: Type-check
        run: bun run ts-check

      - name: End-to-end chain test (certified stack)
        run: bun run test:e2e:certified

      - name: Install dependencies (web)
        run: cd web && bun install --frozen-lockfile

      - name: Build web
        run: bun run build
